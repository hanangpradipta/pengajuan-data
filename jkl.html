<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload KTP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
</head>
<body class="bg-light p-4">
    
    <div class="container-md bg-white p-4 p-md-5 rounded shadow">
        
        <div class="mb-4 p-3 border-2 border-dashed border-secondary rounded bg-light text-center">
            
            <input type="file" id="ktpInput" accept="image/*" capture="environment" class="d-none" onchange="previewKTP(event)">
            <label for="ktpInput" class="btn btn-primary">
                Pilih Foto KTP
            </label>

            <div id="previewContainer" class="d-none mt-3 border-top pt-3">
                <img id="ktpPreview" src="" alt="Preview KTP" class="img-fluid rounded shadow-sm mb-3" style="max-height: 12rem;">
                
                <button id="btnEkstrak" type="button" onclick="ekstrakDataKTP()" class="btn btn-success w-100 w-md-auto">
                    Proses Data
                </button>
                <div id="loadingStatus" class="d-none mt-3">
                    <p id="loadingText" class="text-primary fw-semibold">Memuat...</p>
                    <div class="progress" style="height: 0.625rem;">
                        <div id="progressBar" class="progress-bar bg-primary" style="width: 0%"></div>
                    </div>
                </div>
            </div>
        </div>
            
        <form id="formPengajuan" class="mt-4">
            <div class="mb-3">
                <label class="form-label fw-semibold">NIK</label>
                <input type="text" id="nik" class="form-control">
            </div>
            <div class="mb-3">
                <label class="form-label fw-semibold">Nama Lengkap</label>
                <input type="text" id="nama" class="form-control">
            </div>
            <div class="row mb-3">
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Tempat Lahir</label>
                    <input type="text" id="tempat_lahir" class="form-control">
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Tanggal Lahir</label>
                    <input type="date" id="tanggal_lahir" class="form-control">
                </div>
            </div>
        </form>

        <div class="mt-4 p-3 bg-light border rounded small text-muted">
            <strong>Hasil:</strong>
            <pre id="rawOcrText" class="mt-2" style="white-space: pre-wrap;"></pre>
        </div>
    </div>

    <script>
        let selectedFile = null;

        function previewKTP(event) {
            selectedFile = event.target.files[0];
            if (selectedFile) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = document.getElementById('ktpPreview');
                    img.src = e.target.result;
                    
                    document.getElementById('previewContainer').classList.remove('d-none');
                    document.getElementById('formPengajuan').reset();
                    document.getElementById('rawOcrText').innerText = "";
                    document.getElementById('btnEkstrak').classList.remove('d-none');
                }
                reader.readAsDataURL(selectedFile);
            }
        }

        async function ekstrakDataKTP() {
            const btn = document.getElementById('btnEkstrak');
            const loadingStatus = document.getElementById('loadingStatus');
            const loadingText = document.getElementById('loadingText');
            const progressBar = document.getElementById('progressBar');
            
            btn.classList.add('hidden');
            loadingStatus.classList.remove('hidden');

            try {
                const processedImage = document.getElementById('ktpPreview').src;

                const result = await Tesseract.recognize(
                    processedImage,
                    'ind', 
                    {
                        logger: m => {
                            if(m.status === 'recognizing text'){
                                loadingText.innerText = "Membaca teks... " + Math.round(m.progress * 100) + "%";
                                progressBar.style.width = Math.round(m.progress * 100) + "%";
                            } else {
                                loadingText.innerText = m.status;
                            }
                        }
                    }
                );

                const text = result.data.text;
                document.getElementById('rawOcrText').innerText = text;

                const nikMatch = text.match(/\d{16}/);
                if(nikMatch && document.getElementById('nik')) document.getElementById('nik').value = nikMatch[0];

                const namaMatch = text.match(/Nama\s*[:;]?\s*([^\n]+)/i);
                if(namaMatch && document.getElementById('nama')) document.getElementById('nama').value = namaMatch[1].trim().replace(/[^a-zA-Z\s]/g, '');

                const ttlMatch = text.match(/Lahir\s*[:;]?\s*([^\n]+)/i);
                if(ttlMatch) {
                    const parts = ttlMatch[1].trim().split(',');
                    if(parts.length > 0 && document.getElementById('tempat_lahir')) {
                        document.getElementById('tempat_lahir').value = parts[0].trim().replace(/[^a-zA-Z\s]/g, '');
                    }
                    const dateMatch = ttlMatch[1].match(/(\d{2})[-/](\d{2})[-/](\d{4})/);
                    if(dateMatch && document.getElementById('tanggal_lahir')) {
                        document.getElementById('tanggal_lahir').value = `${dateMatch[3]}-${dateMatch[2]}-${dateMatch[1]}`;
                    }
                }

                loadingStatus.classList.add('hidden');
                btn.classList.remove('hidden');
                btn.innerText = "Selesai";

            } catch (error) {
                console.error(error);
                loadingText.innerText = "Gagal membaca gambar!";
                progressBar.classList.add('bg-red-600');
            }
        }
    </script>
</body>
</html>
